<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blacfox Landing Page Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh}

/* ── Editor Panel ── */
#editor-panel{width:390px;flex-shrink:0;background:#111;border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;height:100vh}
#editor-header{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;flex-shrink:0;gap:12px}
.editor-brand-row{display:flex;align-items:center;gap:10px}
.editor-brand{width:28px;height:28px;border-radius:6px;background:#e95c25;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:0.02em;color:#000;flex-shrink:0}
.editor-title{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#888}
#export-btn{background:#e95c25;color:#fff;border:none;border-radius:9999px;padding:7px 16px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;font-family:'Montserrat',sans-serif;transition:background 0.15s;flex-shrink:0;white-space:nowrap}
#export-btn:hover{background:#f07040}
#editor-subtitle{padding:8px 18px;font-size:10px;line-height:1.5;color:#666;background:#161616;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0}
#editor-body{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;background:#0a0a0a;display:flex;flex-direction:column;gap:12px}
#editor-body::-webkit-scrollbar{width:3px}
#editor-body::-webkit-scrollbar-track{background:transparent}
#editor-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* ── Page Blocks (sections) ── */
.page-block{border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#161616;box-shadow:0 3px 14px rgba(0,0,0,0.35);overflow:hidden;flex-shrink:0}
.page-header{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;background:#1e1e1e;transition:background 0.1s;border-bottom:1px solid rgba(255,255,255,0.09)}
.page-header:hover{background:#242424}
.page-num-badge{font-size:9px;font-weight:800;letter-spacing:0.10em;text-transform:uppercase;color:#888;background:rgba(255,255,255,0.09);border-radius:3px;padding:2px 6px;flex-shrink:0;min-width:26px;text-align:center}
.page-type-badge{font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#e95c25;background:rgba(233,92,37,0.14);border-radius:3px;padding:2px 6px;flex-shrink:0}
.page-type-badge.neutral{color:#888;background:rgba(255,255,255,0.08)}
.page-label{flex:1;font-size:12px;font-weight:700;color:rgba(255,255,255,0.9)}
.page-fixed-badge{font-size:8px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:#555;padding:2px 5px;border-radius:2px;flex-shrink:0}
.page-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.page-move-btn{background:none;border:none;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:3px;transition:color 0.12s,background 0.12s;font-family:inherit}
.page-move-btn:hover{color:#e95c25;background:rgba(233,92,37,0.1)}
.page-move-btn:disabled{opacity:0.2;cursor:default;pointer-events:none}
.page-remove-btn{background:none;border:none;color:rgba(255,255,255,0.25);font-size:14px;cursor:pointer;padding:1px 4px;line-height:1;border-radius:3px;transition:color 0.12s;font-family:inherit}
.page-remove-btn:hover{color:#ff7070}
.chevron{font-size:9px;color:#555;flex-shrink:0;transition:transform 0.15s;margin-left:2px}
.chevron.open{transform:rotate(90deg)}
.page-header[draggable="true"],.comp-header[draggable="true"]{cursor:grab}
.page-header[draggable="true"]:active,.comp-header[draggable="true"]:active{cursor:grabbing}
.drag-handle{color:rgba(255,255,255,0.22);font-size:11px;letter-spacing:-1px;flex-shrink:0;line-height:1;padding-right:1px}
.drag-over-top{box-shadow:inset 0 2px 0 0 #e95c25}
.drag-over-bottom{box-shadow:inset 0 -2px 0 0 #e95c25}
.page-fields{padding:14px 14px 14px;display:flex;flex-direction:column;gap:10px;background:#131313}
.page-fields.collapsed{display:none}
.page-fields>*{flex-shrink:0}
.comps-section-label{font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#666;margin:2px 0 -2px;display:block}

/* ── Variant selector ── */
.variant-row{display:flex;gap:4px;flex-wrap:wrap}
.variant-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(255,255,255,0.5);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;cursor:pointer;font-family:inherit;transition:all 0.12s}
.variant-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.variant-btn.on{background:rgba(233,92,37,0.2);border-color:rgba(233,92,37,0.5);color:#e95c25}
.icon-pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icon-pick-btn{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.7);cursor:pointer;transition:all 0.12s}
.icon-pick-btn:hover{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.25)}
.icon-pick-btn.on{background:rgba(233,92,37,0.2);border-color:rgba(233,92,37,0.5);color:#e95c25}
.icon-pick-btn svg{width:18px;height:18px}
.icon-trigger-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.8);font-size:11px;font-weight:600;padding:7px 10px;cursor:pointer;font-family:inherit;transition:all 0.12s;width:100%}
.icon-trigger-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
.icon-trigger-btn svg{width:16px;height:16px;color:#e95c25;flex-shrink:0}
#icon-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:none;align-items:center;justify-content:center}
#icon-picker-overlay.visible{display:flex}
#icon-picker-modal{background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:18px;width:360px;max-height:80vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,0.6)}
#icon-picker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
#icon-picker-header span{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#888}
#icon-picker-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
#icon-picker-close:hover{color:#fff}

/* ── Fields ── */
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#555}
.field-input{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Montserrat',sans-serif;font-size:12px;padding:7px 10px;width:100%;transition:border-color 0.2s;outline:none}
.field-input:focus{border-color:rgba(233,92,37,0.6)}
.field-rta{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-family:'Montserrat',sans-serif;font-size:12px;padding:7px 10px;width:100%;min-height:52px;line-height:1.6;cursor:text;word-break:break-word;white-space:pre-wrap;outline:none;transition:border-color 0.2s}
.field-rta:focus{border-color:rgba(233,92,37,0.6)}
.field-rta:empty::before{content:'Type here…';color:#444;pointer-events:none}
.field-hint{font-size:9px;color:#444;font-style:italic}
.field-sep{height:1px;background:rgba(255,255,255,0.05);margin:2px 0}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── Cards / list-style sub-editors (cards, plans, testimonials, faq, stats) ── */
.cards-list,.steps-list-edit{display:flex;flex-direction:column;gap:7px}
.card-item,.step-item-edit{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:7px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card-item-head{display:flex;align-items:center;justify-content:space-between}
.card-badge{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#e95c25}
.card-rm{background:none;border:none;color:#444;cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:4px;font-family:inherit;transition:color 0.12s}
.card-rm:hover{color:#ff7070}
.add-card-btn,.add-step-btn,.add-item-btn{background:rgba(233,92,37,0.06);border:1px dashed rgba(233,92,37,0.25);border-radius:6px;color:#e95c25;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:0.04em;padding:6px;width:100%;font-family:inherit;transition:all 0.12s;margin-top:2px}
.add-card-btn:hover,.add-step-btn:hover,.add-item-btn:hover{background:rgba(233,92,37,0.12);border-color:rgba(233,92,37,0.45)}

/* ── List item row ── */
.item-edit-row{display:flex;align-items:flex-start;gap:6px}
.item-edit-row .field-rta{flex:1;min-height:44px}
.item-rm{background:none;border:none;color:#444;cursor:pointer;font-size:15px;line-height:1;padding:3px 4px;border-radius:4px;flex-shrink:0;margin-top:3px;transition:color 0.12s}
.item-rm:hover{color:#ff7070}

/* ── Image upload ── */
.img-upload-wrap{border:1px dashed rgba(255,255,255,0.18);border-radius:8px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:border-color 0.15s,background 0.15s;overflow:hidden}
.img-upload-wrap:hover{border-color:rgba(233,92,37,0.4);background:rgba(233,92,37,0.03)}
.img-upload-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload-lbl{font-size:10px;color:#555;pointer-events:none}
.img-upload-preview{max-width:100%;border-radius:6px;max-height:110px;object-fit:cover;display:block;margin:0 auto 8px;pointer-events:none}
.img-clear-btn{background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);border-radius:4px;color:#ff9999;cursor:pointer;font-size:9px;font-weight:700;padding:3px 8px;font-family:inherit;margin-top:6px;position:relative;z-index:2}

/* ── Component blocks ── */
.comps-list{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;padding-left:10px;border-left:2px solid rgba(233,92,37,0.15)}
.comp-block{background:#1c1c1c;border:1px solid rgba(255,255,255,0.13);border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.comp-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:rgba(233,92,37,0.08);border-bottom:1px solid rgba(255,255,255,0.08);border-left:2px solid rgba(233,92,37,0.5)}
.comp-type-label{font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.65)}
.comp-actions{display:flex;align-items:center;gap:2px}
.comp-move{background:none;border:none;color:rgba(255,255,255,0.2);font-size:11px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:3px;transition:color 0.12s,background 0.12s;font-family:inherit}
.comp-move:hover{color:#e95c25;background:rgba(233,92,37,0.1)}
.comp-move:disabled{opacity:0.2;cursor:default;pointer-events:none}
.comp-remove{background:none;border:none;color:rgba(255,255,255,0.2);font-size:13px;cursor:pointer;padding:1px 4px;line-height:1;border-radius:3px;transition:color 0.12s;font-family:inherit}
.comp-remove:hover{color:#ff7070}
.comp-fields{padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
.empty-page-hint{text-align:center;padding:20px 12px;font-size:11px;color:#444;font-style:italic;border:1px dashed rgba(255,255,255,0.07);border-radius:6px}

/* ── Add component ── */
.add-comp-trigger{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;background:rgba(233,92,37,0.06);border:1px dashed rgba(233,92,37,0.22);border-radius:6px;color:#e95c25;font-size:10px;font-weight:600;cursor:pointer;width:100%;font-family:'Montserrat',sans-serif;transition:all 0.15s;letter-spacing:.02em}
.add-comp-trigger:hover{background:rgba(233,92,37,0.14);border-color:rgba(233,92,37,0.5)}
.add-comp-panel{padding:6px 0 2px}
.add-comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.add-comp-item{display:flex;align-items:flex-start;gap:7px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:rgba(255,255,255,0.6);font-size:9px;padding:7px 8px;text-align:left;cursor:pointer;transition:all 0.12s;font-family:'Montserrat',sans-serif;line-height:1.3}
.add-comp-item:hover{background:rgba(233,92,37,0.1);border-color:rgba(233,92,37,0.3);color:#fff}
.add-comp-item:hover .add-comp-glyph{background:rgba(233,92,37,0.35);color:#fff}
.add-comp-item strong{display:block;font-size:9px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:2px}
.add-comp-item span:not(.add-comp-glyph){font-size:8px;color:#555}
.add-comp-glyph{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transition:all 0.12s}

/* ── Add page ── */
.add-page-trigger{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 12px 8px;padding:9px 14px;background:rgba(233,92,37,0.10);border:1px dashed rgba(233,92,37,0.35);border-radius:7px;color:#e95c25;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;letter-spacing:.02em;width:calc(100% - 24px)}
.add-page-trigger:hover{background:rgba(233,92,37,0.18);border-color:rgba(233,92,37,0.6)}

/* ── Preview Pane ── */
#preview-pane{flex:1;background:#0d0d0d;display:flex;flex-direction:column;overflow:hidden}
#preview-toolbar{background:#1a1a1a;border-bottom:1px solid rgba(255,255,255,0.07);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.preview-dots{display:flex;gap:5px}
.preview-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.12)}
.preview-dots span:first-child{background:#ff5f57}
.preview-dots span:nth-child(2){background:#febc2e}
.preview-dots span:last-child{background:#28c840}
.preview-url-bar{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:5px;padding:5px 12px;font-size:11px;color:#555;font-family:'Montserrat',sans-serif;text-align:center}
#preview-frame{flex:1;border:none;width:100%;background:#0d0d0d}

/* ── RTA Toolbar ── */
#rta-toolbar{position:fixed;z-index:9999;background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:4px 6px;display:flex;align-items:center;gap:2px;box-shadow:0 4px 24px rgba(0,0,0,0.7);opacity:0;pointer-events:none;transition:opacity 0.12s;white-space:nowrap}
#rta-toolbar.visible{opacity:1;pointer-events:all}
.rta-btn{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:11px;font-weight:700;font-family:'Montserrat',sans-serif;padding:4px 7px;border-radius:4px;line-height:1;transition:all 0.1s}
.rta-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.rta-sep{width:1px;height:16px;background:rgba(255,255,255,0.1);margin:0 3px;flex-shrink:0}
.rta-color{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color 0.1s;outline:none;display:inline-block}
.rta-color:hover{border-color:rgba(255,255,255,0.5)}
</style>
</head>
<body>
<div id="app">
  <div id="editor-panel">
    <div id="editor-header">
      <div class="editor-brand-row">
        <div class="editor-brand"><svg viewBox="140 150 800 800" width="16" height="16" xmlns="http://www.w3.org/2000/svg"><path fill="none" stroke="#000" stroke-width="38" stroke-linejoin="round" d="M672.2,800.5c-9.9,0-18.9-5.3-23.9-14.5-21.9-40.6-67.9-99.4-98.3-96.9-17.1,1.5-35.2,27.5-49.8,71.5-4.6,16.6-21.1,28-38.9,26.7h-1.5c-20.5-1.7-36-19.7-34.5-40.2.7-9.8,3-23.7,5.6-39.7,6.3-38.5,15.7-95.4,9.5-140.7l-7.1-1.3c-55.8-10.5-132.2-24.8-183.8-81.1-41-44.8-63.4-85.1-63.6-85.5l-19.6-34.9,39.8-5.6c78.3-11.1,141.8,6.9,188.8,53.4,31.6,31.3,54.9,74.8,69.4,129.4h.2c43.8,0,88.1-17.9,131.8-53.2,71-57.4,112.7-140.7,130.5-176.3,9.8-19.6,18.3-36.5,40.4-31.2,10.6,2.5,21.5,12.1,21.5,28.1s4.6,107.2,96.3,107.9,24.6,8.7,27.7,21.1c5.3,21.6-11.7,30.7-26.7,38.6-125,66-188.3,148.6-188.3,245.5l2.1,50.2c.5,13.1-7.6,24.2-20.2,27.6-2.5.7-5.1,1-7.6,1Z"/></svg></div>
        <span class="editor-title">Landing Page Builder</span>
      </div>
      <button id="export-btn" title="Downloads a self-contained HTML file">↓ Export HTML</button>
    </div>
    <div id="editor-subtitle">Add and arrange sections — the preview on the right updates automatically. Click Export HTML when you're ready to publish.</div>
    <div id="editor-body"></div>
  </div>
  <div id="preview-pane">
    <div id="preview-toolbar">
      <div class="preview-dots"><span></span><span></span><span></span></div>
      <div class="preview-url-bar">landing-page-export.html — Live Preview</div>
    </div>
    <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<div id="rta-toolbar">
  <button class="rta-btn" data-fmt="bold" title="Bold"><b>B</b></button>
  <button class="rta-btn" data-fmt="italic" title="Italic"><i>I</i></button>
  <button class="rta-btn" data-fmt="clear" title="Clear formatting">R</button>
  <div class="rta-sep"></div>
  <button class="rta-color" data-fmt="color" data-color="#ffffff" style="background:#fff" title="White"></button>
  <button class="rta-color" data-fmt="color" data-color="#e95c25" style="background:#e95c25" title="Orange"></button>
  <button class="rta-color" data-fmt="color" data-color="#888888" style="background:#888" title="Muted"></button>
  <button class="rta-color" data-fmt="color" data-color="#000000" style="background:#111;border:2px solid rgba(255,255,255,0.15)" title="Black"></button>
</div>

<div id="icon-picker-overlay">
  <div id="icon-picker-modal">
    <div id="icon-picker-header">
      <span>Choose an Icon</span>
      <button id="icon-picker-close" type="button">×</button>
    </div>
    <div id="icon-picker-grid" class="icon-pick-grid"></div>
  </div>
</div>

<script>
/* ============================================================
   SVG CONSTANTS
   ============================================================ */

const NAV_LOGO_SVG = `<svg width="32" height="32" id="Logo_Artwork" data-name="Logo Artwork" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .cls-1 {
        fill: #f05d2d;
        stroke-width: 0px;
      }
    </style>
  </defs>
  <g id="No_Tag_FullColour" data-name="No Tag FullColour">

.cta-section{padding:var(--space-20) 0;text-align:center;position:relative;z-index:1}
.cta-h{font-size:var(--font-size-7xl);font-weight:var(--font-weight-black);letter-spacing:var(--tracking-tight);color:var(--text-on-accent);line-height:var(--leading-tight);margin-bottom:var(--space-5);position:relative;z-index:1}
.cta-h em{font-style:italic;font-weight:var(--font-weight-black);color:var(--color-orange-500)}
.cta-p{font-size:17px;color:rgba(0,0,0,0.65);margin-bottom:var(--space-10);position:relative;z-index:1;max-width:520px;margin-left:auto;margin-right:auto}
.cta-ctas{display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.cta-section .btn-white{background:var(--color-black);border-color:var(--color-black);color:var(--color-white);box-shadow:none}
.cta-section .btn-white:hover{background:var(--color-grey-800);border-color:var(--color-grey-800);box-shadow:none;transform:translateY(-2px)}
.cta-section .btn-ghost{color:rgba(0,0,0,0.65);border-color:rgba(0,0,0,0.25);background:rgba(0,0,0,0.06)}
.cta-section .btn-ghost:hover{color:rgba(0,0,0,0.85);border-color:rgba(0,0,0,0.4)}
.cta-wrapper.bg-dark{background:var(--color-grey-950)}
.cta-wrapper.bg-dark .cta-h{color:var(--color-white)}
.cta-wrapper.bg-dark .cta-p{color:rgba(255,255,255,0.68)}
.cta-wrapper.bg-dark .cta-section .btn-ghost{color:rgba(255,255,255,0.72);border-color:var(--border-moderate);background:linear-gradient(135deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.03) 50%,rgba(255,255,255,0.08) 100%)}
.cta-wrapper.bg-dark .cta-section .btn-ghost:hover{color:var(--text-primary);border-color:var(--border-strong)}
.lead-form{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lead-form-row{display:flex;gap:14px;flex-wrap:wrap}
.lead-form-field{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.lead-form-label{font-size:var(--type-label-size);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-muted)}
.lead-form-input{background:rgba(255,255,255,0.04);border:1px solid var(--border-card);border-radius:10px;color:var(--text-body);font-family:var(--font-family-base);font-size:15px;padding:14px 16px}
.footer-demo{padding:var(--space-16) 0 var(--space-6)}
.footer-socials{display:flex;gap:var(--space-3);justify-content:center}
.soc{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--border-ui);background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text-muted);font-size:var(--font-size-md);transition:background 0.2s ease,border-color 0.2s ease,color 0.2s ease,transform 0.2s ease}
.soc:hover{background:var(--accent);border-color:var(--accent);color:var(--color-white);transform:translateY(-2px)}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:1px solid var(--border-ui);font-size:var(--font-size-md);color:var(--text-muted)}
.footer-legal-link{color:var(--text-muted);text-decoration:none}
.reveal{opacity:0;transform:translateY(40px);transition:var(--transition-reveal)}
.reveal.visible{opacity:1;transform:translateY(0)}

// template. An HTML parser looks for that exact byte sequence anywhere in a script block's

const GRID_CANVAS_JS = `<script>
(function () {
  var canvases = document.querySelectorAll('canvas.hero-bg-grid');
  canvases.forEach(function (canvas) {
    var ctx = canvas.getContext('2d');
    var squareSize = 64;
    var mouse = { x: -9999, y: -9999 };
    var grid = [];
    var width = 0, height = 0;
    function initGrid() {
      grid.length = 0;
      for (var x = 0; x < width; x += squareSize) {
        for (var y = 0; y < height; y += squareSize) {
          grid.push({ x: x, y: y, alpha: 0, fading: false, lastTouched: 0 });
        }
      }
    }
    function resize() {
      var rect = canvas.parentElement.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
      initGrid();
    }
    function getCellAt(x, y) {
      return grid.find(function (cell) { return x >= cell.x && x < cell.x + squareSize && y >= cell.y && y < cell.y + squareSize; });
    }
    function onMouseMove(e) {
      var rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
      if (mouse.x < 0 || mouse.y < 0 || mouse.x > width || mouse.y > height) return;
      var cell = getCellAt(mouse.x, mouse.y);
      if (cell && cell.alpha === 0) { cell.alpha = 1; cell.lastTouched = Date.now(); cell.fading = false; }
    }
    function draw() {
      ctx.clearRect(0, 0, width, height);
      var now = Date.now();
      for (var i = 0; i < grid.length; i++) {
        var cell = grid[i];
        if (cell.alpha > 0 && !cell.fading && now - cell.lastTouched > 500) cell.fading = true;
        if (cell.fading) { cell.alpha -= 0.02; if (cell.alpha <= 0) { cell.alpha = 0; cell.fading = false; } }
        if (cell.alpha > 0) {
          var cx = cell.x + squareSize / 2, cy = cell.y + squareSize / 2;
          var gradient = ctx.createRadialGradient(cx, cy, 5, cx, cy, squareSize);
          gradient.addColorStop(0, 'rgba(233, 92, 37, ' + cell.alpha + ')');
          gradient.addColorStop(1, 'rgba(233, 92, 37, 0)');
          ctx.strokeStyle = gradient; ctx.lineWidth = 1.3;
          ctx.strokeRect(cell.x + 0.5, cell.y + 0.5, squareSize - 1, squareSize - 1);
        }
      }
      requestAnimationFrame(draw);
    }
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);
    window.addEventListener('mousemove', onMouseMove);
    draw();
  });
})();
` + '<' + '/script>';

   Only injected into the live editor preview (never into the exported file).
   Lets a user click any text directly on the canvas to edit it in place,

   delete toolbar — the core "edit on the canvas" interaction from Wix.

function bfAttr(editMode, pid, cid, fkey) {
  return editMode ? ` data-bf-field="${pid}|${cid||''}|${fkey}"` : '';
}
function bfCompWrap(editMode, pid, cid, label, inner) {
  if (!editMode) return inner;
  return `<div class="bf-comp" data-bf-pid="${pid}" data-bf-cid="${cid}" data-bf-label="${esc(label)}">${inner}</div>`;
}

const EDITOR_BRIDGE_JS = `<script>
(function(){
  var P = window.parent;
  if (!P || typeof P.setField !== 'function') return;

  document.querySelectorAll('[data-bf-field]').forEach(function(el){
    el.setAttribute('contenteditable','true');
    el.spellcheck = false;
    if (el.tagName === 'A' || el.classList.contains('faq-q')) {
      el.addEventListener('click', function(e){ e.preventDefault(); });
    }
    el.addEventListener('input', function(){
      var parts = el.dataset.bfField.split('|');
      var pid = parts[0], cid = parts[1], fkey = parts[2];
      var val = el.innerHTML;
      if (cid) { P.setComponentField(pid, cid, fkey, val); }
      else { P.setField(pid, fkey, val); }
      P.syncSidebarField(pid, cid, fkey, val);
    });
    el.addEventListener('blur', function(){
      if (typeof P.schedulePreview === 'function') P.schedulePreview();
    });
  });

  var toolbar = document.createElement('div');
  toolbar.id = 'bf-toolbar';
  toolbar.innerHTML =
    '<button data-t="up" title="Move up">&#8593;</button>' +
    '<button data-t="down" title="Move down">&#8595;</button>' +
    '<span class="bf-sep"></span>' +
    '<button data-t="dup" title="Duplicate">&#10697;</button>' +
    '<button data-t="del" title="Delete">&#10005;</button>';
  document.body.appendChild(toolbar);

  var selected = null;

  function positionToolbar(el){
    var r = el.getBoundingClientRect();
    toolbar.style.top = Math.max(6, r.top - 34) + 'px';
    toolbar.style.left = Math.max(6, r.left) + 'px';
    toolbar.classList.add('visible');
  }
  function clearSelection(){
    if (selected) selected.classList.remove('bf-selected');
    selected = null;
    toolbar.classList.remove('visible');
  }

  document.querySelectorAll('.bf-comp').forEach(function(el){
    el.addEventListener('click', function(e){
      if (selected) selected.classList.remove('bf-selected');
      selected = el;
      el.classList.add('bf-selected');
      positionToolbar(el);
      e.stopPropagation();
    });
  });

  document.addEventListener('click', function(e){
    if (!e.target.closest('.bf-comp') && !e.target.closest('#bf-toolbar')) clearSelection();
  });
  window.addEventListener('scroll', function(){ if (selected) positionToolbar(selected); }, true);
  window.addEventListener('resize', function(){ if (selected) positionToolbar(selected); });

  toolbar.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-t]');
    if (!btn || !selected) return;
    var pid = selected.dataset.bfPid, cid = selected.dataset.bfCid;
    var t = btn.dataset.t;
    if (t === 'up') P.moveComponent(pid, cid, -1);
    else if (t === 'down') P.moveComponent(pid, cid, 1);
    else if (t === 'dup') P.duplicateComponent(pid, cid);
    else if (t === 'del') P.removeComponent(pid, cid);
    clearSelection();
  });
})();
` + '<' + '/script>';

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ea(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function pageIndex(id) { return state.pages.findIndex(p => p.id === id); }
function fixedIndexes() {
  // First two pages (nav, hero) and last two pages (cta, footer) are fixed.
  return { firstMovable: 2, lastMovable: state.pages.length - 3 };
}

function imgBlock(dataUrl) {
  if (dataUrl) return `<div class="image-block"><img src="${dataUrl}"></div>`;
  return `<div class="image-block"><div class="placeholder"><span>Image Placeholder</span></div></div>`;
}
function bulletItem(text) { return `<li>${text||''}</li>`; }

function renderComponent(comp, pid, editMode) {
  const f = comp.fields;
  const cid = comp.id;
  switch (comp.type) {
    case 'section-tag':
      return `<span class="section-tag"${bfAttr(editMode,pid,cid,'text')}>${esc(f.text||'')}</span>`;
    case 'heading':
      return `<h2 class="section-h"${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</h2>`;
    case 'subheading':
      return `<h3 class="section-sub"${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</h3>`;
    case 'body':
      return `<p class="section-p"${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</p>`;
    case 'heading-text':
      return `<div class="heading-text-block"><h2 class="section-h"${bfAttr(editMode,pid,cid,'heading')}>${f.heading||''}</h2><p class="section-p"${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</p></div>`;
    case 'callout':
      return `<div class="callout-box"><p${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</p></div>`;
    case 'pull-quote':
      return `<div class="pull-quote"><span class="pull-quote-eyebrow"${bfAttr(editMode,pid,cid,'eyebrow')}>${esc(f.eyebrow||'')}</span><div class="pull-quote-text"${bfAttr(editMode,pid,cid,'text')}>${f.text||''}</div><div class="pull-quote-band"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>`;
    case 'stats': {
      const items = (f.items||[]).map((s,i) => `<div><div class="stat-value"${bfAttr(editMode,pid,cid,'items.'+i+'.value')}>${esc(s.value||'')}</div><div class="stat-label"${bfAttr(editMode,pid,cid,'items.'+i+'.label')}>${esc(s.label||'')}</div></div>`).join('');
      return `<div class="stats-row reveal">${items}</div>`;
    }
    case 'trust-logos': {
      const logos = (f.logos||[]).map((l,i) => `<span class="trust-logo"${bfAttr(editMode,pid,cid,'logos.'+i)}>${esc(l)}</span>`).join('\n');
      return `<div class="trust-bar reveal">
  <span class="trust-label"${bfAttr(editMode,pid,cid,'label')}>${esc(f.label||'')}</span>
  ${logos}
</div>`;
    }
    case 'cards-2col':
    case 'cards-3col':
    case 'cards-1col': {
      const cols = comp.type === 'cards-2col' ? 2 : comp.type === 'cards-3col' ? 3 : 1;
      const variant = f.variant || 'numbered';
      const cards = (f.cards||[]).map((c,i) => {
        let badge = '';
        if (variant === 'numbered') badge = `<div class="card-num">${String(i+1).padStart(2,'0')}</div>`;
        else if (variant === 'icon') badge = `<div class="card-num">${mkIcon(c.icon != null ? c.icon : i)}</div>`;
        return `<div class="dark-card"><div class="card-num-slot">${badge}</div><div class="card-title"${bfAttr(editMode,pid,cid,'cards.'+i+'.title')}>${esc(c.title||'')}</div><div class="card-body"${bfAttr(editMode,pid,cid,'cards.'+i+'.body')}>${c.body||''}</div></div>`;
      }).join('');
      return `<div class="card-grid-${cols} reveal">${cards}</div>`;
    }
    case 'steps': {
      const steps = (f.steps||[]).map((s,i) =>
        `<div class="step-item">
          <div class="step-num">Step ${String(i+1).padStart(2,'0')}</div>
          <div><div class="step-label"${bfAttr(editMode,pid,cid,'steps.'+i+'.label')}>${esc(s.label||'')}</div><div class="step-body"${bfAttr(editMode,pid,cid,'steps.'+i+'.body')}>${s.body||''}</div></div>
        </div>`
      ).join('');
      return `<div class="steps-list reveal">${steps}</div>`;
    }
    case 'testimonials': {
      const items = (f.items||[]).map((t,i) =>
        `<div class="testimonial-card">
          <span class="quote-mark">&ldquo;</span>
          <p class="testimonial-quote"${bfAttr(editMode,pid,cid,'items.'+i+'.quote')}>${t.quote||''}</p>
          <div class="testimonial-name"${bfAttr(editMode,pid,cid,'items.'+i+'.name')}>${esc(t.name||'')}</div>
          <div class="testimonial-role"${bfAttr(editMode,pid,cid,'items.'+i+'.role')}>${esc(t.role||'')}</div>
        </div>`
      ).join('');
      return `<div class="testimonial-grid reveal">${items}</div>`;
    }
    case 'pricing': {
      const plans = (f.plans||[]).map((pl,i) => {
        const features = String(pl.featuresText||'').split('\n').filter(Boolean).map(t => `<li>${esc(t)}</li>`).join('');
        return `<div class="pricing-card${pl.highlighted?' featured':''}">
          <div class="pricing-name"${bfAttr(editMode,pid,cid,'plans.'+i+'.name')}>${esc(pl.name||'')}</div>
          <div><span class="pricing-price"${bfAttr(editMode,pid,cid,'plans.'+i+'.price')}>${esc(pl.price||'')}</span><span class="pricing-period"${bfAttr(editMode,pid,cid,'plans.'+i+'.period')}>${esc(pl.period||'')}</span></div>
          <ul class="pricing-features">${features}</ul>
          <a href="${ea(pl.ctaUrl||'#')}" class="${pl.highlighted?'btn-primary':'btn-ghost'}"${bfAttr(editMode,pid,cid,'plans.'+i+'.ctaText')}>${esc(pl.ctaText||'Get Started')}</a>
        </div>`;
      }).join('');
      return `<div class="pricing-grid reveal">${plans}</div>`;
    }
    case 'faq': {
      const items = (f.items||[]).map((qa,i) =>
        `<details class="faq-item"><summary class="faq-q"${bfAttr(editMode,pid,cid,'items.'+i+'.q')}>${esc(qa.q||'')}</summary><div class="faq-a"${bfAttr(editMode,pid,cid,'items.'+i+'.a')}>${qa.a||''}</div></details>`
      ).join('');
      return `<div class="faq-list reveal">${items}</div>`;
    }
    case 'list': {
      const items = (f.items||[]).map((it,i) => `<li${bfAttr(editMode,pid,cid,'items.'+i)}>${it||''}</li>`).join('');
      const tag = f.listType === 'numbered' ? 'ol' : 'ul';
      return `<${tag} class="reveal" style="list-style:none;display:flex;flex-direction:column;gap:var(--space-4);padding-left:0;">${items}</${tag}>`;
    }
    case 'image':
      return `<div class="reveal">${imgBlock(f.dataUrl)}</div>`;
    case 'button-row': {
      const secondary = f.secondaryText ? `<a href="${ea(f.secondaryUrl||'#')}" class="btn-ghost"${bfAttr(editMode,pid,cid,'secondaryText')}>${esc(f.secondaryText)}</a>` : '';
      return `<div class="button-row reveal"><a href="${ea(f.primaryUrl||'#')}" class="btn-primary"${bfAttr(editMode,pid,cid,'primaryText')}>${esc(f.primaryText||'')}</a>${secondary}</div>`;
    }
    case 'spacer': {
      const h = { sm:'16px', md:'32px', lg:'64px' }[f.size||'md'];
      return `<div style="height:${h}"></div>`;
    }
    default: return '';
  }
}

function fld(label, inputHtml, hint) {
  return `<div class="field-group">
    <span class="field-label">${label}</span>
    ${inputHtml}
    ${hint ? `<span class="field-hint">${hint}</span>` : ''}
  </div>`;
}
function inp(pid, fkey, val, ph) {
  return `<input class="field-input" type="text" data-pid="${pid}" data-fkey="${fkey}" value="${ea(val||'')}" placeholder="${ph||''}">`;
}
function rta(pid, fkey, val) {
  return `<div class="field-rta" contenteditable="true" data-pid="${pid}" data-fkey="${fkey}" spellcheck="true">${val||''}</div>`;
}
function bgVariantBtns(pid, current) {
  return [{v:'dark',l:'Dark'},{v:'light',l:'Light'}].map(o =>
    `<button class="variant-btn${current===o.v?' on':''}" data-action="set-field" data-pid="${pid}" data-fkey="background" data-val="${o.v}">${o.l}</button>`
  ).join('');
}

// Component-aware field helpers (include data-cid)
function cInp(pid, cid, fkey, val, ph) {
  return `<input class="field-input" type="text" data-pid="${pid}" data-cid="${cid}" data-fkey="${fkey}" value="${ea(val||'')}" placeholder="${ph||''}">`;
}
function cRta(pid, cid, fkey, val) {
  return `<div class="field-rta" contenteditable="true" data-pid="${pid}" data-cid="${cid}" data-fkey="${fkey}" spellcheck="true">${val||''}</div>`;
}
function cTa(pid, cid, fkey, val, rows) {
  return `<textarea class="field-input" data-pid="${pid}" data-cid="${cid}" data-fkey="${fkey}" rows="${rows||3}" style="resize:vertical;line-height:1.5">${esc(val||'')}</textarea>`;
}

           fld('CTA Button URL', inp(p.id,'ctaUrl',p.fields.ctaUrl,'https://'));
  },
  hero(p) {
    const bg = p.fields.background === 'light' ? 'light' : 'dark';
    return fld('Background', `<div class="variant-row">${bgVariantBtns(p.id, bg)}</div>`, 'Dark background uses white/orange text; light background uses black/orange text') +
           `<div class="field-sep"></div>` +
           fld('Eyebrow Tag', inp(p.id,'eyebrow',p.fields.eyebrow,'e.g. Partner Growth Advisory')) +
           fld('Headline', rta(p.id,'headline',p.fields.headline), 'Select text to bold or italicize it') +
           fld('Subheadline', rta(p.id,'subheadline',p.fields.subheadline)) +
           fld('Body Paragraph', rta(p.id,'bodyPara',p.fields.bodyPara)) +
           `<div class="field-sep"></div>` +
           fld('Primary Button Text', inp(p.id,'primaryText',p.fields.primaryText)) +
           fld('Primary Button URL', inp(p.id,'primaryUrl',p.fields.primaryUrl,'https://')) +

    const bg = p.fields.background === 'dark' ? 'dark' : 'light';
    return fld('Background', `<div class="variant-row">${bgVariantBtns(p.id, bg)}</div>`, 'Dark background uses white/orange text; light background uses black/orange text') +
           `<div class="field-sep"></div>` +
           fld('Headline', rta(p.id,'headline',p.fields.headline), 'Select text to bold or italicize it') +
           fld('Body', rta(p.id,'body',p.fields.body)) +
           fld('Primary Button Text', inp(p.id,'primaryText',p.fields.primaryText)) +
           fld('Primary Button URL', inp(p.id,'primaryUrl',p.fields.primaryUrl,'https://')) +
           fld('Secondary Button Text', inp(p.id,'secondaryText',p.fields.secondaryText,'Optional')) +
           fld('Secondary Button URL', inp(p.id,'secondaryUrl',p.fields.secondaryUrl,'https://'));
  },
  footer(p) {
    return fld('Brand Description', rta(p.id,'description',p.fields.description)) +
           `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
             ${fld('Copyright Year', inp(p.id,'copyrightYear',p.fields.copyrightYear))}
             ${fld('Brand Name', inp(p.id,'copyrightName',p.fields.copyrightName))}
           </div>` +
           fld('Legal Link Text', inp(p.id,'legalText',p.fields.legalText)) +
           fld('Legal Link URL', inp(p.id,'legalUrl',p.fields.legalUrl,'https://'));
  }
};

function buildCompFields(pid, comp) {
  const cid = comp.id;
  const f = comp.fields;
  switch (comp.type) {
    case 'section-tag':
      return fld('Tag Text', cInp(pid, cid, 'text', f.text, 'e.g. Why It Works'));
    case 'heading':
      return fld('Heading', cRta(pid, cid, 'text', f.text));
    case 'subheading':
      return fld('Subheading', cRta(pid, cid, 'text', f.text));
    case 'body':
      return fld('Paragraph', cRta(pid, cid, 'text', f.text));
    case 'heading-text':
      return fld('Heading', cRta(pid, cid, 'heading', f.heading)) + fld('Body Text', cRta(pid, cid, 'text', f.text));
    case 'callout':
      return fld('Callout Text', cRta(pid, cid, 'text', f.text));
    case 'pull-quote':
      return fld('Eyebrow', cInp(pid, cid, 'eyebrow', f.eyebrow, 'e.g. Pull Quote')) + fld('Quote', cRta(pid, cid, 'text', f.text));
    case 'stats':
      return buildStatsCompFields(pid, comp);
    case 'trust-logos':
      return fld('Intro Label', cInp(pid, cid, 'label', f.label)) + buildLogosCompFields(pid, comp);
    case 'cards-2col':
    case 'cards-3col':
    case 'cards-1col':
      return buildCardCompFields(pid, comp);
    case 'steps':
      return buildStepCompFields(pid, comp);
    case 'testimonials':
      return buildTestimonialCompFields(pid, comp);
    case 'pricing':
      return buildPricingCompFields(pid, comp);
    case 'faq':
      return buildFaqCompFields(pid, comp);
    case 'list':
      return buildListCompFields(pid, comp);
    case 'image':
      return buildImageCompFields(pid, comp);
    case 'button-row':
      return fld('Primary Button Text', cInp(pid, cid, 'primaryText', f.primaryText)) +
             fld('Primary Button URL', cInp(pid, cid, 'primaryUrl', f.primaryUrl, 'https://')) +
             fld('Secondary Button Text', cInp(pid, cid, 'secondaryText', f.secondaryText, 'Optional')) +
             fld('Secondary Button URL', cInp(pid, cid, 'secondaryUrl', f.secondaryUrl, 'https://'));
    case 'spacer': {
      const s = f.size || 'md';
      const btns = ['sm','md','lg'].map(v =>
        `<button class="variant-btn${s===v?' on':''}" data-action="set-comp-field" data-pid="${pid}" data-cid="${cid}" data-fkey="size" data-val="${v}">${v==='sm'?'Small':v==='md'?'Medium':'Large'}</button>`
      ).join('');
      return fld('Size', `<div class="variant-row">${btns}</div>`);
    }
    default: return '';
  }
}

function buildCardCompFields(pid, comp) {
  const cid = comp.id;
  const f = comp.fields;
  const variant = f.variant || 'numbered';
  const varRow = fld('Card Style', `<div class="variant-row">${
    [{v:'numbered',l:'Numbered'},{v:'icon',l:'Icon'},{v:'plain',l:'Plain'}].map(o =>
      `<button class="variant-btn${variant===o.v?' on':''}" data-action="set-comp-field" data-pid="${pid}" data-cid="${cid}" data-fkey="variant" data-val="${o.v}">${o.l}</button>`
    ).join('')
  }</div>`);
  const cards = f.cards || [];
  let cardsHtml = `<div class="cards-list" id="clst-${cid}">`;
  cards.forEach((c,i) => {
    const selectedIcon = c.icon != null ? c.icon : i;
    const iconPicker = variant === 'icon' ? fld('Icon', `<button class="icon-trigger-btn" data-action="open-icon-picker" data-pid="${pid}" data-cid="${cid}" data-idx="${i}">${mkIcon(selectedIcon)}<span>Choose Icon</span></button>`) : '';
    cardsHtml += `<div class="card-item">
      <div class="card-item-head">
        <span class="card-badge">${String(i+1).padStart(2,'0')}</span>
        <button class="card-rm" data-action="rm-comp-card" data-pid="${pid}" data-cid="${cid}" data-idx="${i}">×</button>
      </div>
      ${fld('Title', `<input class="field-input" type="text" data-pid="${pid}" data-cid="${cid}" data-fkey="cards.${i}.title" value="${ea(c.title||'')}" placeholder="Card title">`)}
      ${fld('Body', cRta(pid, cid, `cards.${i}.body`, c.body))}

    </div>`;
  });
  cardsHtml += `</div><button class="add-card-btn" data-action="add-comp-card" data-pid="${pid}" data-cid="${cid}">+ Add Card</button>`;

let openPageId = null;

function buildEditor() {
  const body = document.getElementById('editor-body');
  body.innerHTML = '';

  if (openPageId === null && state.pages.length) openPageId = state.pages[0].id;

  const TYPE_LABELS = { nav: 'Nav', hero: 'Hero', cta: 'CTA', footer: 'Footer' };

  state.pages.forEach((page, idx) => {
    const { firstMovable, lastMovable } = fixedIndexes();
    const block = document.createElement('div');
    block.className = 'page-block';
    block.id = 'pageblock-' + page.id;

    const isContent = !page.type; // section pages have no type
    const typeLabel = page.type ? (TYPE_LABELS[page.type] || page.type) : 'Section';
    const typeBadgeClass = isContent ? 'page-type-badge neutral' : 'page-type-badge';

    const moveUpDisabled   = page.fixed || idx <= firstMovable;
    const moveDownDisabled = page.fixed || idx >= lastMovable;

    const actions = page.fixed
      ? `<span class="page-fixed-badge" title="This section can't be moved or deleted.">FIXED</span>`
      : `<div class="page-actions">
          <button class="page-move-btn" data-action="move-up" data-pid="${page.id}" ${moveUpDisabled?'disabled':''}>↑</button>
          <button class="page-move-btn" data-action="move-down" data-pid="${page.id}" ${moveDownDisabled?'disabled':''}>↓</button>
          <button class="page-remove-btn" data-action="remove-page" data-pid="${page.id}">✕</button>
        </div>`;

    let fieldsHtml = '';
    if (isContent) {
      const total = page.components.length;
      const hasPrevPage = state.pages.slice(0, idx).some(pg => !pg.type);
      const hasNextPage = state.pages.slice(idx + 1).some(pg => !pg.type);
      const compsHtml = total === 0
        ? `<div class="empty-page-hint">No components yet — add one below</div>`
        : page.components.map((c,i) => buildComponentBlock(page.id, c, i, total, hasPrevPage, hasNextPage)).join('');
      fieldsHtml = `
        <div class="field-group">
          <span class="field-label">Section Label</span>
          <input class="field-input" type="text" data-action="rename-page" data-pid="${page.id}" value="${ea(page.label||'')}" placeholder="Section name">
        </div>
        <span class="comps-section-label">Components</span>
        <div class="comps-list" id="comps-${page.id}">${compsHtml}</div>
        ${buildAddComponentPanel(page.id)}`;
    } else {
      fieldsHtml = fixedPageFields[page.type] ? fixedPageFields[page.type](page) : '';
    }

    const isOpen = page.id === openPageId;
    block.innerHTML = `<div class="page-header" data-pid="${page.id}" ${page.fixed?'':'draggable="true"'}>
      ${page.fixed?'':'<span class="drag-handle" title="Drag to reorder">⠿</span>'}
      <span class="page-num-badge">${String(idx+1).padStart(2,'0')}</span>
      <span class="${typeBadgeClass}">${typeLabel}</span>
      <span class="page-label">${esc(page.label||typeLabel)}</span>
      ${actions}
      <span class="chevron${isOpen?' open':''}">▶</span>
    </div>
    <div class="page-fields${isOpen?'':' collapsed'}" id="fields-${page.id}">${fieldsHtml}</div>`;
    body.appendChild(block);
  });

  // Add Section button
  const addWrap = document.createElement('div');
  addWrap.style.paddingBottom = '8px';
  addWrap.style.flexShrink = '0';
  addWrap.innerHTML = `<button class="add-page-trigger" data-action="add-page">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><line x1="5.5" y1="1" x2="5.5" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="1" y1="5.5" x2="10" y2="5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Add Blank Section
  </button>`;
  body.appendChild(addWrap);
}

/* ============================================================
   COMPONENT MUTATIONS
   ============================================================ */

function addComponent(pid, ctype) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  p.components.push({ id: newCid(), type: ctype, fields: JSON.parse(JSON.stringify(COMPONENT_DEFAULTS[ctype]||{})) });
  rebuildPageComps(pid);
  schedulePreview();
}

function removeComponent(pid, cid) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  p.components = p.components.filter(c => c.id !== cid);
  rebuildPageComps(pid);
  schedulePreview();
}

function moveComponent(pid, cid, dir) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  const idx = p.components.findIndex(c => c.id === cid);
  if (idx < 0) return;
  const swap = idx + dir;

  if (swap >= 0 && swap < p.components.length) {
    [p.components[idx], p.components[swap]] = [p.components[swap], p.components[idx]];
    rebuildPageComps(pid);
    schedulePreview();
    return;
  }

  // Cross-section: find the nearest adjacent content section in direction dir
  const pageIdx = state.pages.findIndex(pg => pg.id === pid);
  let targetIdx = pageIdx + dir;
  while (targetIdx >= 0 && targetIdx < state.pages.length && state.pages[targetIdx].type) {
    targetIdx += dir;
  }
  if (targetIdx < 0 || targetIdx >= state.pages.length) return;
  const targetPage = state.pages[targetIdx];
  if (!targetPage.components) targetPage.components = [];

  const [comp] = p.components.splice(idx, 1);
  if (dir === -1) {
    targetPage.components.push(comp);     // moving up → append to end of previous section
  } else {
    targetPage.components.unshift(comp);  // moving down → prepend to start of next section
  }
  rebuildPageComps(pid);
  rebuildPageComps(targetPage.id);
  schedulePreview();
}

function duplicateComponent(pid, cid) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  const idx = p.components.findIndex(c => c.id === cid);
  if (idx < 0) return;
  const clone = JSON.parse(JSON.stringify(p.components[idx]));
  clone.id = newCid();
  p.components.splice(idx + 1, 0, clone);
  rebuildPageComps(pid);
  schedulePreview();
}

// Called from inside the preview iframe (Wix-style click-to-edit) after a direct edit,
// so the corresponding sidebar field stays in sync without stealing focus from the preview.
function syncSidebarField(pid, cid, fkey, value) {
  let sel = cid ? `[data-pid="${pid}"][data-cid="${cid}"][data-fkey="${fkey}"]` : `[data-pid="${pid}"][data-fkey="${fkey}"]`;
  let el;
  try { el = document.querySelector('#editor-body ' + sel); } catch (e) { return; }
  if (!el || el === document.activeElement) return;
  if (el.classList.contains('field-rta')) {
    if (el.innerHTML !== value) el.innerHTML = value;
  } else if ('value' in el) {
    if (el.value !== value) el.value = value;
  }
}

function setComponentField(pid, cid, fkey, value) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  const comp = p.components.find(c => c.id === cid);
  if (!comp) return;
  const parts = fkey.split('.');
  if (parts.length === 1) {
    comp.fields[parts[0]] = value;
  } else if (parts.length === 2) {
    const arr = comp.fields[parts[0]];
    if (Array.isArray(arr)) arr[parseInt(parts[1])] = value;
  } else if (parts.length === 3) {
    const arr = comp.fields[parts[0]];
    if (Array.isArray(arr)) {
      if (!arr[parseInt(parts[1])]) arr[parseInt(parts[1])] = {};
      arr[parseInt(parts[1])][parts[2]] = value;
    }
  }
}

function rebuildPageComps(pid) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p) return;
  const el = document.getElementById('comps-' + pid);
  if (!el) return;
  const total = p.components.length;
  const pIdx = state.pages.findIndex(pg => pg.id === pid);
  const hasPrevPage = state.pages.slice(0, pIdx).some(pg => !pg.type);
  const hasNextPage = state.pages.slice(pIdx + 1).some(pg => !pg.type);
  el.innerHTML = total === 0
    ? `<div class="empty-page-hint">No components yet — add one below</div>`
    : p.components.map((c,i) => buildComponentBlock(pid, c, i, total, hasPrevPage, hasNextPage)).join('');
}

/* ============================================================
   PAGE (SECTION) MUTATIONS
   ============================================================ */

function addPage() {
  const page = { id: newId(), label: 'New Section', components: [] };
  state.pages.splice(state.pages.length - 2, 0, page); // insert before CTA
  openPageId = page.id;
  buildEditor();
  schedulePreview();
}

function removePage(pid) {
  const idx = pageIndex(pid);
  if (idx < 0 || state.pages[idx].fixed) return;
  state.pages.splice(idx, 1);
  if (openPageId === pid) {
    openPageId = state.pages.length ? state.pages[0].id : null;
  }
  buildEditor();
  schedulePreview();
}

function movePage(pid, dir) {
  const idx = pageIndex(pid);
  if (idx < 0 || state.pages[idx].fixed) return;
  const swap = idx + dir;
  const { firstMovable, lastMovable } = fixedIndexes();
  if (swap < firstMovable || swap > lastMovable) return;
  [state.pages[idx], state.pages[swap]] = [state.pages[swap], state.pages[idx]];
  buildEditor();
  schedulePreview();
}

/* ============================================================
   FIELD MUTATIONS (nav / hero / cta / footer)
   ============================================================ */

function setField(pid, fkey, value) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p || !p.fields) return;
  p.fields[fkey] = value;
}

function rebuildFixedPageFields(pid) {
  const p = state.pages.find(pg => pg.id === pid);
  if (!p || !fixedPageFields[p.type]) return;
  const el = document.getElementById('fields-' + pid);
  if (!el) return;
  el.innerHTML = fixedPageFields[p.type](p);
}

let _previewTimer = null;
function schedulePreview() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(updatePreview, 250);
}
function updatePreview() {
  const frame = document.getElementById('preview-frame');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(renderLandingPage(false));
  doc.close();
}

/* ============================================================
   DRAG & DROP REORDERING (Wix-style) — sections and components
   ============================================================ */

let _dragType = null; // 'page' | 'comp'
let _dragPid = null;
let _dragCid = null;

function clearDragIndicators() {
  document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
}

function reorderPage(draggedPid, targetPid, before) {
  if (draggedPid === targetPid) return;
  const draggedIdx = pageIndex(draggedPid);
  if (draggedIdx < 0 || state.pages[draggedIdx].fixed) return;
  const { firstMovable, lastMovable } = fixedIndexes();
  const targetIdxBefore = pageIndex(targetPid);
  if (targetIdxBefore < firstMovable || targetIdxBefore > lastMovable) return; // can't drop among fixed pages
  const [dragged] = state.pages.splice(draggedIdx, 1);
  const targetIdxAfter = pageIndex(targetPid);
  let insertAt = before ? targetIdxAfter : targetIdxAfter + 1;
  const { firstMovable: fm2, lastMovable: lm2 } = fixedIndexes();
  insertAt = Math.max(fm2, Math.min(insertAt, lm2 + 1));
  state.pages.splice(insertAt, 0, dragged);
  buildEditor();
  schedulePreview();
}

function reorderComponent(draggedPid, draggedCid, targetPid, targetCid, before) {
  const srcPage = state.pages.find(pg => pg.id === draggedPid);
  const dstPage = state.pages.find(pg => pg.id === targetPid);
  if (!srcPage || !dstPage) return;
  const srcIdx = srcPage.components.findIndex(c => c.id === draggedCid);
  if (srcIdx < 0) return;
  if (srcPage.id === dstPage.id && srcIdx === dstPage.components.findIndex(c => c.id === targetCid)) return;
  const [comp] = srcPage.components.splice(srcIdx, 1);
  let dstIdx = dstPage.components.findIndex(c => c.id === targetCid);
  if (dstIdx < 0) dstIdx = dstPage.components.length;
  const insertAt = before ? dstIdx : dstIdx + 1;
  dstPage.components.splice(insertAt, 0, comp);
  rebuildPageComps(srcPage.id);
  if (dstPage.id !== srcPage.id) rebuildPageComps(dstPage.id);
  schedulePreview();
}

const editorBodyEl = document.getElementById('editor-body');

editorBodyEl.addEventListener('dragstart', function(e) {
  const compHeader = e.target.closest('.comp-header[draggable="true"]');
  const pageHeader = !compHeader && e.target.closest('.page-header[draggable="true"]');
  if (compHeader) {
    _dragType = 'comp';
    _dragPid = compHeader.dataset.pid;
    _dragCid = compHeader.dataset.cid;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _dragCid);
  } else if (pageHeader) {
    _dragType = 'page';
    _dragPid = pageHeader.dataset.pid;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _dragPid);
  }
});

editorBodyEl.addEventListener('dragover', function(e) {
  if (!_dragType) return;
  const targetHeader = _dragType === 'page' ? e.target.closest('.page-header') : e.target.closest('.comp-header');
  if (!targetHeader) return;
  e.preventDefault();
  clearDragIndicators();
  const rect = targetHeader.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  targetHeader.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
});

editorBodyEl.addEventListener('drop', function(e) {
  if (!_dragType) return;
  e.preventDefault();
  const targetHeader = _dragType === 'page' ? e.target.closest('.page-header') : e.target.closest('.comp-header');
  clearDragIndicators();
  if (!targetHeader) { _dragType = null; return; }
  const rect = targetHeader.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;

  if (_dragType === 'page') {
    reorderPage(_dragPid, targetHeader.dataset.pid, before);
  } else if (_dragType === 'comp') {
    reorderComponent(_dragPid, _dragCid, targetHeader.dataset.pid, targetHeader.dataset.cid, before);
  }
  _dragType = null; _dragPid = null; _dragCid = null;
});

editorBodyEl.addEventListener('dragend', function() {
  clearDragIndicators();
  _dragType = null; _dragPid = null; _dragCid = null;
});

/* ============================================================
   RTA TOOLBAR
   ============================================================ */

let _rtaTarget = null;

function positionRtaToolbar() {
  if (!_rtaTarget) return;
  const rect = _rtaTarget.getBoundingClientRect();
  const tb = document.getElementById('rta-toolbar');
  const tbH = 42;
  let top = rect.top - tbH - 8;
  let left = rect.left;
  if (top < 8) top = rect.bottom + 6;
  if (left + 240 > window.innerWidth) left = window.innerWidth - 246;
  tb.style.top = Math.max(8, top) + 'px';
  tb.style.left = Math.max(8, left) + 'px';
}

document.getElementById('editor-body').addEventListener('focusin', function(e) {
  const rta = e.target.closest('.field-rta');
  if (!rta) return;
  _rtaTarget = rta;
  positionRtaToolbar();
  document.getElementById('rta-toolbar').classList.add('visible');
});

document.getElementById('editor-body').addEventListener('focusout', function(e) {
  setTimeout(function() {
    const active = document.activeElement;
    if (!active || (!active.closest('.field-rta') && !active.closest('#rta-toolbar'))) {
      document.getElementById('rta-toolbar').classList.remove('visible');
      _rtaTarget = null;
    }
  }, 120);
});

document.getElementById('editor-body').addEventListener('keyup', positionRtaToolbar);
document.getElementById('editor-body').addEventListener('scroll', positionRtaToolbar, true);

function applyForeColor(color) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const frag = range.extractContents();
  const span = document.createElement('span');
  span.style.color = color;
  span.appendChild(frag);
  range.insertNode(span);
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  sel.addRange(newRange);
}

document.getElementById('rta-toolbar').addEventListener('mousedown', function(e) {
  e.preventDefault();
  const btn = e.target.closest('[data-fmt]');
  if (!btn) return;
  const fmt = btn.dataset.fmt;
  if (fmt === 'bold')        { document.execCommand('bold', false); }
  else if (fmt === 'italic') { document.execCommand('italic', false); }
  else if (fmt === 'clear')  { document.execCommand('removeFormat', false); }
  else if (fmt === 'color')  { applyForeColor(btn.dataset.color); }
  if (_rtaTarget) _rtaTarget.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ============================================================
   ICON PICKER POPUP
   ============================================================ */

let _iconPickerTarget = null;

function openIconPicker(pid, cid, idx) {
  const p = state.pages.find(pg => pg.id === pid);
  const comp = p && p.components.find(c => c.id === cid);
  const card = comp && comp.fields.cards && comp.fields.cards[idx];
  if (!card) return;
  _iconPickerTarget = { pid, cid, idx };
  const selectedIcon = card.icon != null ? card.icon : idx;
  const grid = document.getElementById('icon-picker-grid');
  grid.innerHTML = ICONS.map((_, ii) =>
    `<button class="icon-pick-btn${String(selectedIcon)===String(ii)?' on':''}" data-icon-idx="${ii}" title="Icon ${ii+1}">${mkIcon(ii)}</button>`
  ).join('');
  document.getElementById('icon-picker-overlay').classList.add('visible');
}

function closeIconPicker() {
  document.getElementById('icon-picker-overlay').classList.remove('visible');
  _iconPickerTarget = null;
}

document.getElementById('icon-picker-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeIconPicker();
});
document.getElementById('icon-picker-close').addEventListener('click', closeIconPicker);

document.getElementById('icon-picker-grid').addEventListener('click', function(e) {
  const btn = e.target.closest('.icon-pick-btn');
  if (!btn || !_iconPickerTarget) return;
  const { pid, cid, idx } = _iconPickerTarget;
  setComponentField(pid, cid, `cards.${idx}.icon`, parseInt(btn.dataset.iconIdx));
  rebuildPageComps(pid);
  schedulePreview();
  closeIconPicker();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && _iconPickerTarget) closeIconPicker();
});

// Strip all formatting on paste into RTA fields — plain text only
document.getElementById('editor-body').addEventListener('paste', function(e) {
  const rta = e.target.closest('.field-rta');
  if (!rta) return;
  e.preventDefault();
  const plain = (e.clipboardData || window.clipboardData).getData('text/plain');
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  sel.deleteFromDocument();
  const range = sel.getRangeAt(0);
  const node = document.createTextNode(plain);
  range.insertNode(node);
  range.setStartAfter(node);
  range.setEndAfter(node);
  sel.removeAllRanges();
  sel.addRange(range);
  rta.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ============================================================
   INIT
   ============================================================ */

buildEditor();
updatePreview();

</script>
</body>
